name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app eval scripts tests

      - name: Tests
        run: python -m pytest

  eval-gate:
    # The suite proves the code does what it says; this proves the system still
    # refuses what it cannot answer. Nothing else catches a change that quietly
    # trades away the refusal behaviour.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Evaluate
        # No API key in CI on purpose: the offline extractive answerer makes this
        # deterministic and free, and the gated metrics are decided before
        # generation anyway.
        env:
          RAG_LLM_API_KEY: ""
        run: python -m eval.run_eval --json-out eval-report.json

      - name: Gate on refusal metrics
        run: python scripts/check_eval_gate.py eval-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
